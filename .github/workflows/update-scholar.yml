name: Update Scholar stats

on:
  schedule:
    - cron: '0 20 * * 0'   # Sundays 20:00 UTC (Monday morning in Sydney)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch Scholar data
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: node scripts/update-scholar.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/scholar.json; then
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/scholar.json
            git commit -m "Update Scholar stats"
            git push
          fi
